name: Build MockGPS APK

on:
  push:
    branches:
      - chatgpt/mockgps-v1
    paths:
      - 'mockgps/**'
      - '.github/workflows/build-mockgps.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: mockgps
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MockGPS-CN-debug
          path: mockgps/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
