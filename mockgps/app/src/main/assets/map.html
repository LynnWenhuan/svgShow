<!doctype html>
<html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>
<style>html,body,#map{height:100%;margin:0} .tip{position:absolute;z-index:9999;top:8px;left:8px;right:8px;background:white;padding:8px 10px;border-radius:10px;font:14px sans-serif;box-shadow:0 2px 10px #9998}</style>
</head><body><div class="tip">点击地图选择位置；地图无法加载时可直接输入经纬度</div><div id="map"></div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map').setView([22.543096,114.057865],13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
let marker=L.marker([22.543096,114.057865]).addTo(map);
map.on('click',e=>{ marker.setLatLng(e.latlng); if(window.AndroidBridge){AndroidBridge.onMapPicked(e.latlng.lat,e.latlng.lng);} });
</script></body></html>
